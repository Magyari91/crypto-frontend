services:
  - type: web
    name: crypto-frontend
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: ./out
    autoDeployTrigger: checksPass
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_ADSENSE_CLIENT
        sync: false
      - key: NEXT_PUBLIC_ADSENSE_CMP_READY
        value: "false"
      - key: NEXT_PUBLIC_ADSENSE_SLOT_DASHBOARD
        sync: false
      - key: NEXT_PUBLIC_ADSENSE_SLOT_MARKET
        sync: false
      - key: NEXT_PUBLIC_OPERATOR_NAME
        sync: false
      - key: NEXT_PUBLIC_CONTACT_EMAIL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
